    <!-- Theme: aplica antes de renderizar para evitar flash -->

      (function(){
        if(localStorage.getItem('cvr-theme')==='light') document.documentElement.classList.add('light-mode');
      })();
    </script>

                    <li class="nav-item">

                    </li>
                    <li class="nav-item">

                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Semestres
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="semestre1.html">Semestre 1</a></li>
                            <li><a class="dropdown-item" href="semestre2.html">Semestre 2</a></li>
                            <li><a class="dropdown-item" href="semestre3.html">Semestre 3</a></li>

                                        src="../images/recursos /bloqueado.png" alt="" width="16" /></a></li>

    <!-- DIAGRAMAS — 2 columnas para que se vean más grandes -->

            <div class="row row-cols-1 row-cols-md-2 g-4">

                <!-- Diagrama 1 — cambia src y título -->
                <div class="col">
                    <div class="card h-100">
                        <img src="../images/imgsemestre4/Mysql.png" class="card-img-top" alt="Diagrama 1" />
                        <div class="card-body text-center">
                            <p class="card-title fw-bold">Antes</p>
                        </div>
                    </div>
                </div>

                <!-- Diagrama 2 — cambia src y título -->
                <div class="col">
                    <div class="card h-100">
                        <img src="../images/imgsemestre4/postgresql.jpg" class="card-img-top" alt="Diagrama 2" />

            <div class="row justify-content-center">
                <div class="col-lg-9 col-md-11">

                    <!-- Cambia el src por la ruta real de tu PDF -->

            </span>
            <div class="d-flex gap-3 fs-4">

    </footer>


    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Navbar scrolled
      const navbar = document.querySelector('.navbar');
      if(navbar) window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 40);
      });
      // Theme toggle
      const btn = document.getElementById('themeToggle');
      if(btn) btn.addEventListener('click', () => {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('cvr-theme', isLight ? 'light' : 'dark');
      });
    </script>

</body>

</html>
